name: Daily Post

on:
  schedule:
    - cron: '0 17 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Publish daily post
        run: node post.mjs
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
      - name: Keep repo active (prevents 60-day scheduled-workflow auto-disable)
        if: always()
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > last-run.txt
          git config user.name  "m3ak-bot"
          git config user.email "m3ak-bot@users.noreply.github.com"
          git add last-run.txt
          git commit -m "chore: keepalive $(date -u +%F)" || echo "no changes to commit"
          git push
